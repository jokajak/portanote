name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Vim integration smoke test
        run: node scripts/vim-smoke.mjs
      - name: Go tests
        run: go test ./...
