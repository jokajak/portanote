name: Vendor Vimee

on:
  push:
    branches: [feature/vim-mode]
    paths:
      - scripts/vimee-entry.js
      - scripts/apply-vim-mode.mjs
      - .github/workflows/vendor-vimee.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/vim-mode
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build pinned browser bundle
        run: |
          npm install --no-save --ignore-scripts @vimee/core@0.3.0 @vimee/plugin-textarea@0.1.2 esbuild@0.25.11
          npx esbuild scripts/vimee-entry.js --bundle --minify --format=iife --global-name=VimeeTextarea --outfile=ui/vendor/vimee-textarea-0.1.2.min.js
      - name: Apply Portanote integration
        run: node scripts/apply-vim-mode.mjs
      - name: Commit generated integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui/app.js ui/app.css ui/index.html ui/vendor/vimee-textarea-0.1.2.min.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate optional Vim mode"
          git push
