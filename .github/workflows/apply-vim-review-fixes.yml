name: Apply Vim Review Fixes

on:
  push:
    branches: [feature/vim-mode]
    paths:
      - scripts/apply-vim-review-fixes.mjs
      - .github/workflows/apply-vim-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/vim-mode
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply app.js fixes
        run: node scripts/apply-vim-review-fixes.mjs
      - name: Run smoke test
        run: node scripts/vim-smoke.mjs
      - name: Commit app integration changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui/app.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep Vim state synchronized with Portanote edits"
          git pull --rebase origin feature/vim-mode
          git push
